<title>Field Day Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<style>
  :root {
    --ground: #F5F2EA;
    --panel: #FBF9F3;
    --panel-2: #EFEBDF;
    --ink: #1A1D24;
    --ink-soft: #2E323B;
    --slate: #5A5F6B;
    --slate-2: #8A8F98;
    --rule: #D9D2C0;
    --rule-strong: #B8B09A;
    --accent: #B23A2C;
    --accent-soft: #E4C7BF;
    --gold: #B08133;
    --gold-soft: #E9D9AE;
    --track: #3D6B4C;
    --track-soft: #C7D8CB;
    --alarm: #9C4223;
    --shadow: 0 1px 0 rgba(26,29,36,.04), 0 2px 8px rgba(26,29,36,.04);
    --serif: "Noto Serif TC", "Songti TC", "PingFang TC", serif;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --mono: "IBM Plex Mono", "Menlo", monospace;
    --label: "IBM Plex Sans", "Noto Sans TC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #13151A;
      --panel: #1B1E25;
      --panel-2: #22262F;
      --ink: #ECE7DA;
      --ink-soft: #D2CCBD;
      --slate: #9A9FA9;
      --slate-2: #6B7079;
      --rule: #2D323C;
      --rule-strong: #3C424E;
      --accent: #D25547;
      --accent-soft: #4A2521;
      --gold: #D8A757;
      --gold-soft: #4A3B1E;
      --track: #6BA37F;
      --track-soft: #22382A;
      --alarm: #D45A3A;
      --shadow: 0 1px 0 rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #13151A;
    --panel: #1B1E25;
    --panel-2: #22262F;
    --ink: #ECE7DA;
    --ink-soft: #D2CCBD;
    --slate: #9A9FA9;
    --slate-2: #6B7079;
    --rule: #2D323C;
    --rule-strong: #3C424E;
    --accent: #D25547;
    --accent-soft: #4A2521;
    --gold: #D8A757;
    --gold-soft: #4A3B1E;
    --track: #6BA37F;
    --track-soft: #22382A;
    --alarm: #D45A3A;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  aside {
    background: var(--panel);
    border-right: 1px solid var(--rule);
    padding: 22px 0 32px;
    position: sticky; top: 0; height: 100vh;
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .brand { padding: 0 22px 20px; border-bottom: 1px solid var(--rule); margin-bottom: 14px; }
  .brand-mark { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .brand-mark .dot { width: 10px; height: 10px; border-radius: 999px; background: var(--accent); align-self: center; }
  .brand h1 { font-family: var(--serif); font-weight: 900; font-size: 22px; margin: 0; letter-spacing: .02em; }
  .brand .sub { font-family: var(--label); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--slate); padding-left: 20px; }

  .session-badge {
    margin: 0 18px 10px;
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--rule);
    border-radius: 3px;
    font-size: 12px;
  }
  .session-badge .role {
    font-family: var(--label);
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 2px;
  }
  .session-badge .who { font-family: var(--serif); font-weight: 500; }
  .session-badge.admin .who { color: var(--accent); }
  .session-badge.class .who { color: var(--track); }
  .session-badge .actions { margin-top: 6px; display: flex; gap: 6px; }
  .session-badge a.link {
    font-size: 11px; color: var(--slate); cursor: pointer; text-decoration: none;
    font-family: var(--label); letter-spacing: .1em; text-transform: uppercase;
  }
  .session-badge a.link:hover { color: var(--ink); }

  nav { flex: 1; overflow-y: auto; }
  nav .group-label { font-family: var(--label); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--slate-2); padding: 12px 22px 6px; }
  nav button.nav-item {
    all: unset;
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 7px 22px; cursor: pointer;
    color: var(--ink-soft); font-size: 14px; position: relative;
    transition: background 120ms;
  }
  nav button.nav-item:hover { background: var(--panel-2); }
  nav button.nav-item.active { color: var(--ink); background: var(--panel-2); font-weight: 500; }
  nav button.nav-item.active::before {
    content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; background: var(--accent);
  }
  nav button.nav-item .glyph { font-family: var(--serif); color: var(--slate); font-size: 15px; width: 18px; text-align: center; }
  nav button.nav-item.active .glyph { color: var(--accent); }
  nav button.nav-item[disabled] { opacity: .35; cursor: not-allowed; }

  .sidebar-footer {
    margin: 12px 22px 0;
    font-family: var(--label);
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--slate-2);
    border-top: 1px solid var(--rule);
    padding-top: 12px;
  }
  .sync-dot { display: inline-block; width: 6px; height: 6px; border-radius: 999px; background: var(--track); margin-right: 6px; vertical-align: middle; }
  .sync-dot.off { background: var(--slate-2); }

  /* ---------- Main ---------- */
  main { min-width: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--rule);
    background: var(--ground);
    position: sticky; top: 0; z-index: 5;
  }
  .topbar .crumbs { font-family: var(--label); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--slate); }
  .topbar h2 { font-family: var(--serif); font-weight: 700; font-size: 22px; margin: 2px 0 0; letter-spacing: .01em; }
  .year-picker { display: flex; align-items: center; gap: 10px; }
  .year-picker label { font-family: var(--label); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--slate); }

  select, input, button, textarea { font-family: var(--sans); font-size: 14px; color: var(--ink); }
  select, input[type="text"], input[type="number"], input[type="password"], input[type="date"], textarea {
    background: var(--panel); border: 1px solid var(--rule);
    padding: 7px 10px; border-radius: 3px; outline: none;
    transition: border-color 120ms;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--accent); }
  input[type="number"], input[type="password"] { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  textarea { font-family: var(--mono); font-size: 12px; }

  button.btn {
    all: unset;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 3px; cursor: pointer;
    font-size: 13px; font-weight: 500;
    border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
    transition: all 120ms;
  }
  button.btn:hover { border-color: var(--rule-strong); }
  button.btn[disabled] { opacity: .4; cursor: not-allowed; }
  button.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.btn.primary:hover { background: #9E2E22; }
  button.btn.ghost { background: transparent; border-color: transparent; color: var(--slate); }
  button.btn.ghost:hover { color: var(--ink); background: var(--panel-2); }
  button.btn.danger { color: var(--alarm); }
  button.btn.danger:hover { background: var(--accent-soft); }
  button.btn.track { background: var(--track); color: #fff; border-color: var(--track); }
  button.btn.track:hover { background: #325A3E; }

  /* Content */
  .view { padding: 24px 32px 60px; }

  /* KPI */
  .kpi-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1px; background: var(--rule); border: 1px solid var(--rule);
    border-radius: 4px; overflow: hidden; margin-bottom: 28px;
  }
  .kpi { background: var(--panel); padding: 18px 20px; }
  .kpi .label { font-family: var(--label); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--slate); margin-bottom: 8px; }
  .kpi .value { font-family: var(--mono); font-weight: 500; font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .kpi .foot { font-size: 12px; color: var(--slate); margin-top: 4px; }

  .split { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; }
  @media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }

  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
  .card + .card { margin-top: 24px; }
  .card header { padding: 14px 18px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card header h3 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 15px; letter-spacing: .02em; }
  .card header .hint { font-family: var(--label); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--slate); }
  .card .body { padding: 4px 0; }
  .card .body.pad { padding: 16px 18px; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--rule); font-size: 13px; vertical-align: middle; }
  th {
    font-family: var(--label); font-weight: 500; font-size: 10px;
    letter-spacing: .16em; text-transform: uppercase; color: var(--slate);
    background: var(--panel); position: sticky; top: 0;
  }
  tbody tr:hover { background: var(--panel-2); }
  td.num, th.num { font-family: var(--mono); text-align: right; }
  td.rank { font-family: var(--mono); font-weight: 600; width: 44px; text-align: center; color: var(--slate); }
  td.rank.top1 { color: var(--gold); }
  td.rank.top2 { color: var(--slate); }
  td.rank.top3 { color: var(--accent); }

  .pill {
    display: inline-block;
    font-family: var(--label); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 2px;
    border: 1px solid var(--rule-strong); color: var(--slate);
  }
  .pill.track { border-color: var(--track); color: var(--track); background: var(--track-soft); }
  .pill.field { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .pill.relay { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
  .pill.male { border-color: var(--slate); color: var(--slate); }
  .pill.female { border-color: var(--accent); color: var(--accent); }
  .pill.mixed { border-color: var(--gold); color: var(--gold); }
  .pill.round { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }

  .record-flag {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--label); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--gold); font-weight: 600;
  }
  .record-flag::before { content: "★"; font-size: 12px; }

  .form-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px 14px; padding: 18px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--rule);
  }
  .field label { display: block; font-family: var(--label); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--slate); margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; }
  .field.wide { grid-column: span 2; }

  .toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .toolbar .grow { flex: 1; }
  .toolbar input[type="text"] { min-width: 220px; }

  .champ-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }
  @media (max-width: 1200px) { .champ-grid { grid-template-columns: 1fr; } }
  .standings tr td:first-child { padding-left: 18px; }
  .standings .points { font-family: var(--mono); font-weight: 600; font-size: 15px; text-align: right; padding-right: 18px; }
  .standings .rank-medal {
    width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-weight: 600; font-size: 11px;
    border-radius: 999px; background: var(--panel-2); color: var(--slate);
    margin-right: 8px;
  }
  .standings tr:nth-child(1) .rank-medal { background: var(--gold); color: #fff; }
  .standings tr:nth-child(2) .rank-medal { background: var(--slate); color: #fff; }
  .standings tr:nth-child(3) .rank-medal { background: var(--accent); color: #fff; }

  .records-list .event-row {
    display: grid; grid-template-columns: 1fr 220px 160px 120px 80px;
    align-items: center; padding: 12px 18px;
    border-bottom: 1px solid var(--rule); gap: 12px;
  }
  .records-list .event-row:hover { background: var(--panel-2); }
  .records-list .event-name { font-family: var(--serif); font-weight: 500; font-size: 14px; }
  .records-list .mark { font-family: var(--mono); font-weight: 600; font-size: 16px; color: var(--ink); }
  .records-list .holder { font-size: 13px; }
  .records-list .year-col { font-family: var(--mono); color: var(--slate); font-size: 12px; }

  .empty { padding: 40px 18px; text-align: center; color: var(--slate); }
  .empty h4 { font-family: var(--serif); font-size: 16px; margin: 0 0 6px; color: var(--ink-soft); }

  .result-entry-grid {
    display: grid;
    grid-template-columns: 60px 60px 60px 1fr 120px 60px 60px 60px;
    gap: 8px; padding: 8px 18px;
    border-bottom: 1px solid var(--rule);
    align-items: center;
  }
  .result-entry-grid.head { background: var(--panel); font-family: var(--label); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--slate); padding: 10px 18px; }
  .result-entry-grid input, .result-entry-grid select { width: 100%; }
  .result-entry-grid .num-input { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .rank-cell { font-family: var(--mono); font-weight: 600; text-align: center; color: var(--slate); }
  .points-cell { font-family: var(--mono); font-weight: 600; text-align: center; }

  .round-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule); background: var(--panel); }
  .round-tabs button {
    all: unset;
    padding: 10px 18px; cursor: pointer;
    font-family: var(--label); font-size: 11px;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--slate);
    border-bottom: 2px solid transparent;
  }
  .round-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(26,29,36,.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--rule);
    border-radius: 4px; box-shadow: var(--shadow);
    max-width: 480px; width: 100%;
    max-height: 90vh; display: flex; flex-direction: column;
  }
  .modal.wide { max-width: 720px; }
  .modal header { padding: 16px 18px; border-bottom: 1px solid var(--rule); font-family: var(--serif); font-weight: 700; font-size: 16px; }
  .modal .body { padding: 18px; overflow: auto; }
  .modal footer { padding: 12px 18px; border-top: 1px solid var(--rule); display: flex; justify-content: flex-end; gap: 8px; background: var(--panel-2); }

  .toast-holder { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--ink); color: var(--ground);
    padding: 10px 16px; border-radius: 3px; font-size: 13px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    animation: toast-in .2s ease-out;
  }
  @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  a { color: var(--accent); }
  .loading { padding: 60px; text-align: center; color: var(--slate); font-family: var(--label); letter-spacing: .1em; text-transform: uppercase; font-size: 11px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* Team roster grid */
  .roster {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    padding: 12px 18px;
  }
  .roster .slot {
    padding: 10px 12px; border: 1px dashed var(--rule-strong);
    border-radius: 3px; background: var(--panel);
    font-size: 12px; color: var(--slate);
    display: flex; justify-content: space-between; align-items: center;
  }
  .roster .slot.filled { border-style: solid; color: var(--ink); background: var(--panel-2); }
  .roster .slot .n { font-family: var(--mono); color: var(--slate); font-size: 11px; }
  .roster .slot .name { font-family: var(--serif); font-weight: 500; }
  .roster .slot button { all: unset; cursor: pointer; color: var(--alarm); font-size: 11px; }

  /* Login */
  .login-shell {
    max-width: 420px; margin: 40px auto 0;
    background: var(--panel);
    border: 1px solid var(--rule); border-radius: 4px;
    padding: 32px;
  }
  .login-shell h3 {
    font-family: var(--serif); font-weight: 700; font-size: 20px;
    margin: 0 0 6px;
  }
  .login-shell p.hint { color: var(--slate); font-size: 13px; margin: 0 0 20px; }
  .login-shell .field { margin-bottom: 14px; }
  .login-shell .row { display: flex; gap: 8px; }
  .login-tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid var(--rule); }
  .login-tabs button {
    all: unset; padding: 10px 16px; cursor: pointer;
    font-family: var(--label); font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--slate); border-bottom: 2px solid transparent;
  }
  .login-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ---------- Print ---------- */
  .print-picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .print-picker .doc-card {
    padding: 20px; border: 1px solid var(--rule); border-radius: 4px;
    background: var(--panel); cursor: pointer;
    transition: border-color 120ms, background 120ms;
  }
  .print-picker .doc-card:hover { border-color: var(--accent); background: var(--panel-2); }
  .print-picker .doc-card h4 { font-family: var(--serif); font-weight: 700; margin: 0 0 6px; font-size: 16px; }
  .print-picker .doc-card p { margin: 0; color: var(--slate); font-size: 12px; }

  .print-area { display: none; }
  body.printing .print-area { display: block; }
  body.printing .app { display: none; }

  .print-back {
    position: fixed; top: 16px; right: 20px; z-index: 100;
  }

  @page { size: A4; margin: 1.6cm; }
  @media print {
    body { background: #fff; color: #000; }
    .no-print, .app, aside, .topbar, .toast-holder, .print-back { display: none !important; }
    .print-area { display: block !important; }
    body.printing .print-area { padding: 0; }
    body { font-family: var(--serif); }
  }

  /* Program / results printable */
  .print-doc {
    max-width: 720px; margin: 0 auto 40px;
    background: #fff; color: #111;
    padding: 40px 48px;
    border: 1px solid var(--rule);
    font-family: var(--serif);
  }
  @media print { .print-doc { border: 0; padding: 0; max-width: none; margin: 0; } }
  .print-doc .cover { text-align: center; padding: 80px 0; page-break-after: always; }
  .print-doc .cover .schoolyear { font-family: var(--label); font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: #555; }
  .print-doc .cover h1 { font-family: var(--serif); font-weight: 900; font-size: 40px; margin: 20px 0 12px; letter-spacing: .1em; }
  .print-doc .cover .sub { font-family: var(--serif); font-size: 16px; color: #444; }
  .print-doc .cover .rule { width: 60px; height: 2px; background: #B23A2C; margin: 24px auto; }

  .print-doc h2.section {
    font-family: var(--serif); font-weight: 700; font-size: 20px;
    margin: 24px 0 8px; padding-bottom: 4px;
    border-bottom: 1.5px solid #333; letter-spacing: .05em;
  }
  .print-doc h3.event-head {
    font-family: var(--serif); font-weight: 700; font-size: 15px;
    margin: 18px 0 4px; color: #B23A2C;
  }
  .print-doc h3.event-head .cat { font-family: var(--label); font-size: 10px; letter-spacing: .14em; color: #666; margin-left: 8px; font-weight: 500; }
  .print-doc .participants { font-size: 12px; color: #333; line-height: 1.7; padding-left: 12px; }
  .print-doc .participants span { display: inline-block; margin-right: 14px; }

  .ceremony-record .big-title {

<script>
(() => {
  "use strict";

  const state = {
    year: null,
    years: [],
    events: [],
    students: [],
    registrations: [],
    results: [],
    teams: [],
    classes: [],
    settings: {},
    view: "dashboard",
    db: null,
    ready: false,
    session: null,
    backend: "local",   // "claude" | "gsheets" | "local"
    gsheetsUrl: "",
  };

  // 若要硬編 Google Sheets URL 讓所有開啟此檔案的人都用同一個後端，改這裡：
  const GSHEETS_URL_HARDCODED = "";

  const DEFAULT_SCORING = [9, 7, 6, 5, 4, 3, 2, 1];

  // 民國學年度顯示：西元 2026 → 民國 115
  function rocYear(ceYear) { return ceYear ? ceYear - 1911 : ceYear; }
  // 使用者輸入可能是民國(3位數)或西元(4位數)，都轉成西元
  function ceFromInput(y) {
    const n = parseInt(y, 10);
    if (isNaN(n)) return null;
    if (n < 200) return n + 1911;   // 民國年
    return n;                        // 西元年
  }

  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const LS_SESSION = "fieldday.session";
  const LS_DATA = "fieldday.v2.data";

  // ---------- Session ----------
  function loadSession() {
    try { state.session = JSON.parse(localStorage.getItem(LS_SESSION) || "null"); }
    catch (e) { state.session = null; }
  }
  function saveSession() {
    if (state.session) localStorage.setItem(LS_SESSION, JSON.stringify(state.session));
    else localStorage.removeItem(LS_SESSION);
  }

  // ---------- Persistence ----------
  function loadLocal() {
    try { return JSON.parse(localStorage.getItem(LS_DATA) || "null"); }
    catch (e) { return null; }
  }
  function saveLocal() {
    try {
      localStorage.setItem(LS_DATA, JSON.stringify({
        events: state.events, students: state.students,
        registrations: state.registrations, results: state.results,
        teams: state.teams, classes: state.classes,
        settings: state.settings, years: state.years,
      }));
    } catch (e) {}
  }

  async function initDb() {
    // 優先順序 1：Claude Artifact 內建資料庫
    try {
      if (window.claude && typeof window.claude.use === "function") {
        const db = await window.claude.use("db");
        if (db) {
          state.db = db;
          state.backend = "claude";
          $("#syncDot").classList.remove("off");
          $("#syncText").textContent = "Claude 雲端";
          subscribeAll();
          return;
        }
      }
    } catch (e) { console.warn("Claude db unavailable:", e); }

    // 優先順序 2：Google Sheets
    const gsUrl = GSHEETS_URL_HARDCODED || localStorage.getItem("fieldday.gsheetsUrl") || "";
    if (gsUrl) {
      state.gsheetsUrl = gsUrl;
      state.backend = "gsheets";
      $("#syncDot").classList.remove("off");
      $("#syncText").textContent = "Google Sheets";
      const ok = await gsheetsRefresh();
      ensureSeed();
      ensureYear();
      state.ready = true;
      render();
      if (ok) startGsheetsPolling();
      return;
    }

    // 優先順序 3：本機儲存（單機模式）
    state.backend = "local";
    $("#syncText").textContent = "本機模式";
    const saved = loadLocal();
    if (saved) Object.assign(state, saved);
    ensureSeed();
    ensureYear();
    state.ready = true;
    render();
  }

  // ---------- Google Sheets backend ----------
  let gsheetsPollTimer = null;

  async function gsheetsRefresh() {
    if (!state.gsheetsUrl) return false;
    try {
      const res = await fetch(state.gsheetsUrl + "?action=listAll&t=" + Date.now(), {
        method: "GET",
        redirect: "follow",
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const j = await res.json();
      if (j.error) throw new Error(j.error);
      const d = j.data || {};
      if (d.events) state.events = d.events;
      if (d.students) state.students = d.students;
      if (d.registrations) state.registrations = d.registrations;
      if (d.results) state.results = d.results;
      if (d.teams) state.teams = d.teams;
      if (d.classes) state.classes = d.classes;
      if (d.years) state.years = d.years.map(y => y.year || parseInt(y.id, 10)).filter(y => y).sort((a, b) => b - a);
      if (d.settings) {
        const obj = {};
        d.settings.forEach(s => obj[s.id] = s);
        state.settings = obj;
      }
      $("#syncDot").classList.remove("off");
      $("#syncText").textContent = "Google Sheets";
      if (state.ready) render();
      return true;
    } catch (e) {
      console.warn("gsheets refresh failed:", e);
      $("#syncText").textContent = "同步失敗";
      $("#syncDot").classList.add("off");
      return false;
    }
  }

  function startGsheetsPolling() {
    if (gsheetsPollTimer) clearInterval(gsheetsPollTimer);
    gsheetsPollTimer = setInterval(gsheetsRefresh, 5000);
  }
  function stopGsheetsPolling() {
    if (gsheetsPollTimer) { clearInterval(gsheetsPollTimer); gsheetsPollTimer = null; }
  }

  async function gsheetsCall(action, params) {
    const res = await fetch(state.gsheetsUrl, {
      method: "POST",
      redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({ action, ...params }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    if (j.error) throw new Error(j.error);
    return j;
  }

  function upsertLocal(collection, id, data) {
    if (collection === "settings") {
      state.settings[id] = { id, ...data };
    } else {
      const list = state[collection] || (state[collection] = []);
      const idx = list.findIndex(x => x.id === id);
      const item = { id, ...data };
      if (idx >= 0) list[idx] = item; else list.push(item);
    }
  }
  function removeLocal(collection, id) {
    if (collection === "settings") delete state.settings[id];
    else state[collection] = (state[collection] || []).filter(x => x.id !== id);
  }

  function subscribeAll() {
    const collections = ["events", "students", "registrations", "results", "teams", "classes", "years", "settings"];
    let loaded = 0;
    collections.forEach(name => {
      state.db.collection(name).onSnapshot(snap => {
        const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (name === "years") state.years = docs.map(d => d.year).sort((a, b) => b - a);
        else if (name === "settings") {
          const obj = {};
          docs.forEach(d => obj[d.id] = d);
          state.settings = obj;
        } else state[name] = docs;
        loaded++;
        if (loaded >= collections.length && !state.ready) {
          ensureSeed();
          ensureYear();
          state.ready = true;
        }
        render();
      }, err => console.warn(name, err));
    });
  }

  async function dbSet(collection, id, data) {
    if (state.backend === "claude") {
      await state.db.collection(collection).doc(id).set(data);
    } else if (state.backend === "gsheets") {
      upsertLocal(collection, id, data);
      render();
      gsheetsCall("set", { collection, id, data }).catch(e => {
        console.warn("gsheets set failed:", e);
        toast("儲存失敗，將重試");
      });
    } else {
      upsertLocal(collection, id, data);
      saveLocal();
      render();
    }
  }
  async function dbAdd(collection, data) {
    const id = "id_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await dbSet(collection, id, data);
    return id;
  }
  async function dbDelete(collection, id) {
    if (state.backend === "claude") {
      await state.db.collection(collection).doc(id).delete();
    } else if (state.backend === "gsheets") {
      removeLocal(collection, id);
      render();
      gsheetsCall("delete", { collection, id }).catch(e => {
        console.warn("gsheets delete failed:", e);
        toast("刪除失敗，將重試");
      });
    } else {
      removeLocal(collection, id);
      saveLocal();
      render();
    }
  }
  async function addYear(y) {
    const doc = { year: y, createdAt: new Date().toISOString() };
    if (state.backend === "claude") {
      await state.db.collection("years").doc(String(y)).set(doc);
    } else if (state.backend === "gsheets") {
      if (!state.years.includes(y)) state.years.push(y);
      state.years.sort((a, b) => b - a);
      render();
      gsheetsCall("set", { collection: "years", id: String(y), data: doc }).catch(e => console.warn(e));
    } else {
      if (!state.years.includes(y)) state.years.push(y);
      state.years.sort((a, b) => b - a);
      saveLocal();
      render();
    }
  }

  // ---------- Auth ----------
  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function setAdminPassword(password) {
    const salt = Math.random().toString(36).slice(2, 12);
    const hash = await sha256(password + ":" + salt);
    await dbSet("settings", "admin", { passwordHash: hash, salt });
  }
  async function loginAdmin(password) {
    const admin = state.settings.admin;
    if (!admin) {
      await setAdminPassword(password);
      state.session = { role: "admin" };
      saveSession();
      return { ok: true, firstTime: true };
    }
    const hash = await sha256(password + ":" + admin.salt);
    if (hash !== admin.passwordHash) return { ok: false, msg: "密碼錯誤" };
    state.session = { role: "admin" };
    saveSession();
    return { ok: true };
  }
  async function setClassPassword(className, password) {
    const salt = Math.random().toString(36).slice(2, 12);
    const hash = await sha256(password + ":" + salt);
    const existing = state.classes.find(c => c.className === className);
    if (existing) await dbSet("classes", existing.id, { className, passwordHash: hash, salt });
    else await dbAdd("classes", { className, passwordHash: hash, salt });
  }
  async function loginClass(className, password) {
    const cls = state.classes.find(c => c.className === className);
    if (!cls) return { ok: false, msg: "此班級尚未建立帳號，請請管理員先建立" };
    const hash = await sha256(password + ":" + cls.salt);
    if (hash !== cls.passwordHash) return { ok: false, msg: "密碼錯誤" };
    state.session = { role: "class", className };
    saveSession();
    return { ok: true };
  }
  function logout() {
    state.session = null;
    saveSession();
    state.view = "dashboard";
    render();
  }

    const s = state.settings.school || {};
    return {
      schoolName: s.schoolName || "本校",
      principalName: s.principalName || "校　　長",

  function isSetupPhase() { return !state.settings.admin; }
  function role() { return state.session ? state.session.role : (isSetupPhase() ? "admin" : "guest"); }

  function can(action, target) {
    const r = role();
    if (r === "admin") return true;
    if (r === "class") {
      const cls = state.session.className;
      switch (action) {
        case "register":       return target === cls;
        case "editTeam":       return target === cls;
        case "enterResult":    return true;
        case "editEvent":      return false;
        case "editStudent":    return false;
        case "manageClasses":  return false;
        case "manageYear":     return false;
      }
      return false;
    }
    return false; // guest
  }

  // ---------- Seed ----------
  function ensureSeed() {
    // Google Sheets 模式不自動塞範例資料，使用者從空白開始
    if (state.backend === "gsheets") {
      if (state.years.length === 0) addYear(new Date().getFullYear());
      return;
    }
    if (state.events.length === 0) seedEvents().forEach(e => dbAdd("events", e));
    if (state.students.length === 0) seedStudents().forEach(s => dbAdd("students", s));
    if (state.years.length === 0) addYear(new Date().getFullYear());
    setTimeout(() => {
      if (state.results.length === 0 && state.events.length > 0 && state.students.length > 0) seedResults();
    }, 200);
  }

  function seedStudents() {
    const students = [];
    const classes = {
      "國小低": ["一甲", "一乙", "二甲", "二乙"],
      "國小中": ["三甲", "三乙", "四甲", "四乙"],

    };

    let sid = 1;
    Object.entries(classes).forEach(([grp, cls]) => cls.forEach(c => {
      for (let i = 0; i < 8; i++) {
        const m = i % 2 === 0;
        const nm2 = surnames[Math.floor(Math.random() * surnames.length)] + (m ? nm : nf)[Math.floor(Math.random() * (m ? nm : nf).length)];
        students.push({
          studentId: String(112000 + sid++), name: nm2,

  }
  function classGrade(className) {
    if (!className) return 1;
    // 雙語部格式：1A, 2B, ..., 6B, 或 10A, 11B, 12A
    const m = className.match(/^(\d+)/);
    if (m) return Math.min(12, parseInt(m[1], 10));
    const map = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9 };
    if (className.startsWith("高")) return 9 + (map[className[1]] || 1);
    return map[className[0]] || 1;
  }
  function gradeGroupOf(className) {
    const g = classGrade(className);
    if (g <= 2) return "國小低"; if (g <= 4) return "國小中";
    if (g <= 6) return "國小高"; if (g <= 9) return "國中";
    return "高中";
  }
  function seedResults() {

      const eligible = state.students.filter(s => s.gradeGroup === ev.gradeGroup && (ev.gender === "mixed" || s.gender === ev.gender));
      const picks = shuffle(eligible).slice(0, Math.min(8, eligible.length));
      picks.forEach((s, i) => {
        const mark = ev.unit === "seconds" ? +(10 + Math.random() * 5 + i * 0.3).toFixed(2) : +(4 + Math.random() * 3 - i * 0.15).toFixed(2);
        const round = ev.rounds === "prelim_final" ? "final" : "single";
        dbAdd("results", {

          className: s.className, mark, round,
          heat: null, lane: i + 1,
          competitorType: "student",
        });
      });
    });
  }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function ensureYear() { if (!state.year) state.year = state.years[0] || new Date().getFullYear(); }

  // ---------- Ranking ----------
  function rankResults(results, unit) {
    const sorted = results.slice().sort((a, b) => {
      if (a.mark == null && b.mark == null) return 0;
      if (a.mark == null) return 1;
      if (b.mark == null) return -1;
      return unit === "seconds" ? a.mark - b.mark : b.mark - a.mark;
    });
    return sorted.map((r, i) => ({
      ...r,
      rank: r.mark != null ? i + 1 : null,
      points: r.mark != null && i < DEFAULT_SCORING.length ? DEFAULT_SCORING[i] : 0,
    }));
  }

  function scoringResultsForEvent(eventId, year) {
    const ev = state.events.find(e => e.id === eventId);
    if (!ev) return [];
    const all = state.results.filter(r => r.eventId === eventId && r.year === year);
    const relevantRound = ev.rounds === "prelim_final" ? "final" : "single";
    const filtered = all.filter(r => (r.round || "single") === relevantRound);
    return rankResults(filtered, ev.unit);
  }

  function championshipStandings(year) {
    const byClass = new Map();
    state.events.forEach(ev => {
      const ranked = scoringResultsForEvent(ev.id, year);
      ranked.forEach(r => {
        if (!r.points) return;
        const k = r.className;
        byClass.set(k, (byClass.get(k) || 0) + r.points);
      });
    });
    return Array.from(byClass.entries())
      .map(([className, points]) => ({ className, points, grade: classGrade(className), gradeGroup: gradeGroupOf(className) }))
      .sort((a, b) => b.points - a.points);
  }

  function eventRecord(eventId) {
    const ev = state.events.find(e => e.id === eventId);
    if (!ev) return null;
    const all = state.results.filter(r => r.eventId === eventId && r.mark != null);
    const relevant = ev.rounds === "prelim_final" ? "final" : "single";
    const scoring = all.filter(r => (r.round || "single") === relevant);
    if (scoring.length === 0) return null;
    const best = scoring.reduce((a, b) => ev.unit === "seconds" ? (a.mark <= b.mark ? a : b) : (a.mark >= b.mark ? a : b));
    const student = state.students.find(s => s.id === best.studentId);
    const team = state.teams.find(t => t.id === best.teamId);
    return {
      mark: best.mark, year: best.year,
      student: student ? student.name : (team ? `${team.className} 接力隊` : (best.className || "—")),
      className: best.className || (student ? student.className : "—"),
    };
  }

  function formatMark(m, unit) {
    if (m == null || Number.isNaN(m)) return "—";
    return unit === "seconds" ? m.toFixed(2) + "″" : m.toFixed(2) + " m";
  }

  // ---------- CSV ----------
  function parseCSV(text) {
    const rows = [];
    let cur = [], field = "", inQuote = false, i = 0;
    while (i < text.length) {
      const c = text[i];
      if (inQuote) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i += 2; continue; }
        if (c === '"') { inQuote = false; i++; continue; }
        field += c; i++;
      } else {
        if (c === '"') { inQuote = true; i++; continue; }
        if (c === ",") { cur.push(field); field = ""; i++; continue; }
        if (c === "\r") { i++; continue; }
        if (c === "\n") { cur.push(field); rows.push(cur); cur = []; field = ""; i++; continue; }
        field += c; i++;
      }
    }
    if (field !== "" || cur.length) { cur.push(field); rows.push(cur); }
    return rows.filter(r => r.some(f => f.trim() !== ""));
  }

        </div>
        <pre style="background:var(--panel-2); padding:12px; border-radius:3px; font-size:12px; margin:0 0 14px;">學號,姓名,班級,性別
112001,王小明,高一甲,M
112002,林小美,高一甲,F
112003,張大同,五乙,男</pre>
        <textarea id="csv-text" rows="12" placeholder="貼上或輸入 CSV 內容…" style="width:100%;"></textarea>
        <div style="margin-top:10px;">
          <label style="font-size:12px; color:var(--slate);">
            <input type="checkbox" id="csv-skip-header" checked> 略過第一列（標題列）
          </label>
        </div>
      `,
      okLabel: "匯入",
      onOk: async (m) => {
        const text = m.querySelector("#csv-text").value.trim();
        if (!text) return toast("請貼上 CSV 內容");
        const rows = parseCSV(text);
        const skip = m.querySelector("#csv-skip-header").checked;
        const dataRows = skip ? rows.slice(1) : rows;
        let ok = 0, skip2 = 0;
        for (const r of dataRows) {
          const [sid, name, cn, genderRaw] = r.map(x => (x || "").trim());
          if (!name || !cn) { skip2++; continue; }
          const g = (genderRaw || "").toUpperCase();
          const gender = (g === "M" || g === "男") ? "male" : (g === "F" || g === "女") ? "female" : "male";
          // dedupe by studentId if present, else by name+class
          const exists = state.students.find(s =>
            (sid && s.studentId === sid) || (!sid && s.name === name && s.className === cn));
          if (exists) { skip2++; continue; }
          await dbAdd("students", {
            studentId: sid, name, className: cn,
            grade: classGrade(cn), gradeGroup: gradeGroupOf(cn),
            gender,
          });
          ok++;
        }
        toast(`匯入 ${ok} 筆${skip2 ? ` · 略過 ${skip2}` : ""}`);
        return true;
      },
    });
  }

        <textarea id="csv-text" rows="12" placeholder="貼上或輸入 CSV 內容…" style="width:100%;"></textarea>
        <div style="margin-top:10px; display:flex; gap:16px; flex-wrap:wrap; font-size:12px;">
          <label style="color:var(--slate);"><input type="checkbox" id="csv-skip-header" checked> 略過第一列（標題列）</label>
          <label style="color:var(--slate);">賽制：<select id="csv-round">
            <option value="final">決賽（final）</option>
            <option value="single">單場（single）</option>
          </select></label>
        </div>
      `,
      okLabel: "匯入",
      onOk: async (m) => {
        const text = m.querySelector("#csv-text").value.trim();
        if (!text) { toast("請貼上 CSV 內容"); return false; }
        const rows = parseCSV(text);
        const skip = m.querySelector("#csv-skip-header").checked;
        const round = m.querySelector("#csv-round").value;
        const dataRows = skip ? rows.slice(1) : rows;
        const yearsAdded = new Set();
        let created = 0, imported = 0, skipEv = 0, newStu = 0;
        for (const r of dataRows) {
          const [sid, name, cn, yearRaw, evName, markRaw, rankRaw] = r.map(x => (x || "").trim());
          const year = ceFromInput(yearRaw);
          const mark = parseFloat(markRaw);
          if (!sid || !evName || isNaN(year) || isNaN(mark)) { continue; }
          // Find or create student
          let stu = state.students.find(s => s.studentId === sid);
          if (!stu && name && cn) {
            const id = await dbAdd("students", {
              studentId: sid, name, className: cn,
              grade: classGrade(cn), gradeGroup: gradeGroupOf(cn),
              gender: "male",
            });
            stu = { id, studentId: sid, name, className: cn };
            newStu++;
          }
          if (!stu) continue;
          // Find event by name
          const ev = state.events.find(e => e.name === evName);
          if (!ev) { skipEv++; continue; }
          // Ensure year exists
          if (!state.years.includes(year) && !yearsAdded.has(year)) {
            await addYear(year);
            yearsAdded.add(year);
          }
          // Dedupe: if existing result for this student+event+year+round already, skip
          const existing = state.results.find(x =>
            x.studentId === stu.id && x.eventId === ev.id && x.year === year &&
            (x.round || "single") === round);
          if (existing) continue;
          await dbAdd("results", {
            year, eventId: ev.id, studentId: stu.id,
            className: cn || stu.className, mark,
            round,
            competitorType: "student",
            heat: null, lane: null,
          });
          imported++;
        }
        toast(`匯入 ${imported} 筆成績${newStu ? ` · 新增 ${newStu} 位學生` : ""}${skipEv ? ` · 略過 ${skipEv} 筆（找不到項目）` : ""}`);
        return true;
      },
    });
  }

  function exportStudentsCsv() {
    const rows = [["學號", "姓名", "班級", "性別"]];
    state.students.forEach(s => rows.push([s.studentId || "", s.name, s.className, s.gender === "female" ? "F" : "M"]));
    const csv = rows.map(r => r.map(c => /[,"\n]/.test(c) ? `"${String(c).replace(/"/g, '""')}"` : c).join(",")).join("\n");
    downloadFile("students.csv", csv);

  async function downloadFile(name, text) {
    const data = "﻿" + text;
    try {
      if (window.claude && typeof window.claude.use === "function") {
        const dl = await window.claude.use("downloads");
        if (dl) {
          await dl.save({ filename: name, data });
          return;
        }
      }
    } catch (e) { console.warn("downloads unavailable:", e); }
    // Fallback for local file usage
    const blob = new Blob([data], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

    card.appendChild(h(`<header><h3>成績登錄</h3><span class="hint">${rocYear(state.year)} 學年度</span></header>`));

    const eventOpts = state.events.map(e => `<option value="${e.id}">${e.gradeGroup} · ${e.name}${e.rounds === "prelim_final" ? " · 預+決" : ""}${e.category === "relay" ? " · 接力" : ""}</option>`).join("");

    let currentRound = "single";

    async function refresh() {
      const eid = bar.querySelector("#res-event").value;
      const ev = state.events.find(e => e.id === eid);
      if (!ev) { body.innerHTML = `<div class="empty">請先建立項目。</div>`; return; }
      bar.querySelector("#res-unit-hint").textContent = ev.unit === "seconds" ? "計時 · 越小越好" : "距離 · 越大越好";

      body.innerHTML = "";

      // Round tabs
      if (ev.rounds === "prelim_final") {
        if (currentRound === "single") currentRound = "prelim";
        const tabs = h(`
          <div class="round-tabs">
            <button data-r="prelim" class="${currentRound === 'prelim' ? 'active' : ''}">預賽</button>
            <button data-r="final" class="${currentRound === 'final' ? 'active' : ''}">決賽</button>
          </div>`);
        tabs.querySelectorAll("button").forEach(b => b.onclick = () => { currentRound = b.dataset.r; refresh(); });
        body.appendChild(tabs);
      } else {
        currentRound = "single";
      }

      // Build participants list
      let rows = [];
      if (ev.category === "relay") {
        const teams = state.teams.filter(t => t.eventId === eid && t.year === state.year);
        teams.forEach(t => {
          const existing = state.results.find(r => r.eventId === eid && r.year === state.year && r.teamId === t.id && (r.round || "single") === currentRound);
          rows.push({
            key: t.id, competitorType: "team", teamId: t.id,
            name: `${t.className} 接力隊`, className: t.className,
            memberNames: (t.members || []).slice(0, 4).map(id => state.students.find(s => s.id === id)?.name || "").filter(Boolean).join("、"),
            mark: existing ? existing.mark : null,
            heat: existing ? existing.heat : null,
            lane: existing ? existing.lane : null,
            resultId: existing ? existing.id : null,
          });
        });
      } else {
        // Individual: source = registrations + any results
        const regs = state.registrations.filter(r => r.eventId === eid && r.year === state.year);
        const doneIds = new Set();
        regs.forEach(r => {
          const s = state.students.find(x => x.id === r.studentId);
          if (!s) return;
          doneIds.add(s.id);
          const existing = state.results.find(x => x.eventId === eid && x.year === state.year && x.studentId === s.id && (x.round || "single") === currentRound);
          // Also seed prelim-time-based finalists if final round and no result yet
          rows.push({
            key: s.id, competitorType: "student", studentId: s.id,
            name: s.name, className: s.className, memberNames: "",
            mark: existing ? existing.mark : null,
            heat: existing ? existing.heat : null,
            lane: existing ? existing.lane : null,
            resultId: existing ? existing.id : null,
          });
        });
        // Also include any result without registration
        state.results.filter(r => r.eventId === eid && r.year === state.year && (r.round || "single") === currentRound && r.studentId).forEach(r => {
          if (doneIds.has(r.studentId)) return;
          const s = state.students.find(x => x.id === r.studentId);

            key: r.studentId, competitorType: "student", studentId: r.studentId,

      const ranked = rankResults(rows.map(r => ({ ...r, id: r.resultId || r.key })), ev.unit);

      // Prelim-final: show "Generate finals" button when in prelim tab
      if (ev.rounds === "prelim_final" && currentRound === "prelim" && can("enterResult")) {
        const has = state.results.some(r => r.eventId === eid && r.year === state.year && (r.round || "single") === "prelim" && r.mark != null);

          </div>`);
        body.appendChild(genBar);
        genBar.querySelector("#gen-btn").onclick = () => {
          const n = parseInt(genBar.querySelector("#gen-n").value, 10) || 8;
          generateFinals(eid, n);
        };
      }

      // Header row
      const isRelay = ev.category === "relay";
      body.appendChild(h(`
        <div class="result-entry-grid head">
          <div>名次</div><div>${ev.rounds === "prelim_final" ? "組" : "組"}</div><div>道次</div>
          <div>${isRelay ? "隊伍" : "學生"} / 班級</div>
          <div>成績（${ev.unit === "seconds" ? "秒" : "公尺"}）</div>
          <div>得分</div><div style="text-align:center;">紀錄</div><div></div>
        </div>`));

      const rec = eventRecord(eid);

      // sort rows: by heat/lane if set, else by rank
      rows.sort((a, b) => {
        if (a.heat != null && b.heat != null && a.heat !== b.heat) return a.heat - b.heat;
        if (a.lane != null && b.lane != null && a.lane !== b.lane) return a.lane - b.lane;
        const ra = rankMap.get(a.resultId || a.key)?.rank || 999;
        const rb = rankMap.get(b.resultId || b.key)?.rank || 999;
        return ra - rb;
      });

      const isScoringRound = (ev.rounds === "prelim_final" && currentRound === "final") || ev.rounds === "single";

      rows.forEach(r => {
        const rk = rankMap.get(r.resultId || r.key) || {};
        let breaks = false;
        if (isScoringRound && r.mark != null && (!rec || (ev.unit === "seconds" ? r.mark < rec.mark : r.mark > rec.mark))) breaks = true;

        const rankCell = isScoringRound
          ? `<div class="rank-cell ${rk.rank === 1 ? "top1" : rk.rank === 2 ? "top2" : rk.rank === 3 ? "top3" : ""}">${rk.rank || "—"}</div>`
          : `<div class="rank-cell">${rk.rank || "—"}</div>`;

        const canEdit = can("enterResult");

        const row = h(`
          <div class="result-entry-grid">
            ${rankCell}
            <div><input type="number" ${canEdit ? "" : "disabled"} value="${r.heat != null ? r.heat : ""}" placeholder="—" class="num-input" style="text-align:center;" min="1" data-field="heat"></div>
            <div><input type="number" ${canEdit ? "" : "disabled"} value="${r.lane != null ? r.lane : ""}" placeholder="—" class="num-input" style="text-align:center;" min="1" max="8" data-field="lane"></div>
            <div>
              <div style="font-family:var(--serif); font-weight:500;">${r.name}</div>
              <div style="font-size:11px; color:var(--slate);">${r.className}${r.memberNames ? ` · ${r.memberNames}` : ""}</div>
            </div>
            <div><input type="number" ${canEdit ? "" : "disabled"} step="0.01" class="num-input" value="${r.mark != null ? r.mark : ""}" placeholder="—" data-field="mark"></div>
            <div class="points-cell">${isScoringRound && rk.points ? rk.points : "—"}</div>
            <div style="text-align:center;">${breaks ? `<span class="record-flag">破紀錄</span>` : ""}</div>
            <div style="text-align:right;">
              ${r.resultId && canEdit ? `<button class="btn ghost danger" data-clear>清除</button>` : ""}
            </div>
          </div>`);

        const inputs = row.querySelectorAll("input");
        let debounce;
        inputs.forEach(input => {
          input.oninput = () => {
            clearTimeout(debounce);
            debounce = setTimeout(async () => {
              const heat = parseNumOrNull(row.querySelector('[data-field="heat"]').value);
              const lane = parseNumOrNull(row.querySelector('[data-field="lane"]').value);
              const mark = parseNumOrNull(row.querySelector('[data-field="mark"]').value);
              const hasAny = heat != null || lane != null || mark != null;
              const payload = {
                year: state.year, eventId: eid,
                className: r.className,
                mark, heat, lane,
                round: currentRound,
                competitorType: r.competitorType,
                ...(r.competitorType === "team" ? { teamId: r.teamId } : { studentId: r.studentId }),
              };
              if (r.resultId) {
                if (!hasAny) await dbDelete("results", r.resultId);
                else await dbSet("results", r.resultId, payload);
              } else if (hasAny) {
                await dbAdd("results", payload);
              }
            }, 400);
          };
        });
        const clear = row.querySelector("[data-clear]");
        if (clear) clear.onclick = async () => { if (r.resultId) await dbDelete("results", r.resultId); };
        body.appendChild(row);

      if (rows.length === 0) {
        body.appendChild(h(`<div class="empty"><h4>${isRelay ? "尚無隊伍" : "尚無報名"}</h4><div>${isRelay ? "請至「接力隊伍」由各班報名。" : "請至「報名」新增選手。"}</div></div>`));

    bar.querySelector("#res-event").onchange = () => { currentRound = "single"; refresh(); };

  function parseNumOrNull(v) { if (v === "" || v == null) return null; const n = parseFloat(v); return isNaN(n) ? null : n; }

  async function generateFinals(eid, n) {
    const ev = state.events.find(e => e.id === eid);
    if (!ev) return;
    const prelims = state.results.filter(r => r.eventId === eid && r.year === state.year && (r.round || "single") === "prelim" && r.mark != null);
    if (prelims.length === 0) return toast("尚無預賽成績");
    const ranked = rankResults(prelims, ev.unit).slice(0, n);
    // Spiral lane assignment: 4,5,3,6,2,7,1,8
    const spiral = [4, 5, 3, 6, 2, 7, 1, 8];
    // Remove existing finals for this event/year
    const existing = state.results.filter(r => r.eventId === eid && r.year === state.year && (r.round || "single") === "final");
    for (const e of existing) await dbDelete("results", e.id);
    // Create new finals
    for (let i = 0; i < ranked.length; i++) {
      const src = ranked[i];
      const lane = spiral[i] || i + 1;
      await dbAdd("results", {
        year: state.year, eventId: eid,
        className: src.className,
        mark: null, heat: null, lane,
        round: "final",
        competitorType: src.competitorType || "student",
        ...(src.competitorType === "team" ? { teamId: src.teamId } : { studentId: src.studentId }),
      });
    }
    toast(`已建立 ${ranked.length} 位決賽名單`);
  }

    const scanBar = h(`
      <div class="scan-input">

    const summary = h(`<div class="checkin-summary" id="ci-sum"></div>`);
    card.appendChild(summary);

    const body = h(`<div class="checkin-grid" id="ci-body"></div>`);
    card.appendChild(body);

    function currentEntries(eid) {
      const ev = state.events.find(e => e.id === eid);
      if (!ev) return { ev, entries: [] };
      if (ev.category === "relay") {
        const teams = state.teams.filter(t => t.eventId === eid && t.year === state.year);
        return {
          ev,
          entries: teams.map(t => ({
            key: t.id, kind: "team", teamId: t.id, className: t.className,
            label: `${t.className} 接力隊`,
            sub: `${(t.members || []).length} 人`,
            state: t.checkinState || "pending",
          })),
        };
      }
      const regs = state.registrations.filter(r => r.eventId === eid && r.year === state.year);
      return {
        ev,
        entries: regs.map(r => {
          const s = state.students.find(x => x.id === r.studentId);
          return {
            key: r.id, kind: "reg", regId: r.id, studentId: r.studentId,
            className: r.className,
            label: s ? s.name : "—",
            sub: `${r.className} · ${s ? s.studentId || "" : ""}`,
            state: r.checkinState || "pending",
          };
        }),
      };
    }

    async function setCheckin(entry, newState) {
      if (entry.kind === "reg") {
        const reg = state.registrations.find(r => r.id === entry.regId);
        if (!reg) return;
        await dbSet("registrations", reg.id, { ...reg, checkinState: newState, checkedInAt: new Date().toISOString() });
      } else {
        const t = state.teams.find(x => x.id === entry.teamId);
        if (!t) return;
        await dbSet("teams", t.id, { ...t, checkinState: newState, checkedInAt: new Date().toISOString() });
      }

      const eid = bar.querySelector("#ci-event").value;
      const { ev, entries } = currentEntries(eid);
      if (!ev) { body.innerHTML = `<div class="empty">請先建立項目。</div>`; summary.innerHTML = ""; return; }

      const present = entries.filter(e => e.state === "present").length;
      const absent = entries.filter(e => e.state === "absent").length;
      const pending = entries.length - present - absent;
      summary.innerHTML = `
        <div class="g-present"><div class="num">${present}</div><div class="lb">已到</div></div>
        <div class="g-absent"><div class="num">${absent}</div><div class="lb">未到</div></div>

      body.innerHTML = "";
      if (entries.length === 0) {
        body.innerHTML = `<div class="empty">尚無 ${ev.category === "relay" ? "隊伍" : "報名"}。</div>`;

      entries.forEach(e => {
        const card = h(`

              <div class="name">${e.label}</div>
              <div class="sub">${e.sub}</div>
            </div>
            <div class="mark"></div>
          </div>`);
        card.onclick = async () => {
          const next = e.state === "pending" ? "present" : e.state === "present" ? "absent" : "pending";
          await setCheckin(e, next);
        };
        body.appendChild(card);
      });

    scanBar.querySelector("#ci-scan").addEventListener("keydown", async (ev) => {
      if (ev.key !== "Enter") return;
      const sid = ev.target.value.trim();
      if (!sid) return;
      const eid = bar.querySelector("#ci-event").value;
      const { entries } = currentEntries(eid);
      const stu = state.students.find(s => s.studentId === sid);
      if (!stu) { toast(`找不到學號 ${sid}`); ev.target.value = ""; return; }
      const entry = entries.find(e => e.studentId === stu.id);
      if (!entry) { toast(`${stu.name} 未報名此項`); ev.target.value = ""; return; }
      await setCheckin(entry, "present");
      toast(`✓ ${stu.name} 已到`);
      ev.target.value = "";

    bar.querySelector("#ci-event").onchange = refresh;
    bar.querySelector("#ci-reset").onclick = () => {
      confirmModal("清除本項目所有檢錄狀態？", "已到 / 未到 的紀錄會全部改回「待檢錄」。", async () => {
        const eid = bar.querySelector("#ci-event").value;
        const { ev, entries } = currentEntries(eid);

  function printProgram() {
    const wrap = document.createElement("div");
    const sch = getSchoolSettings();
    const doc = h(`<div class="print-doc"></div>`);
    doc.appendChild(h(`
      <div class="cover">
        <div class="schoolyear">${sch.schoolName} · ${rocYear(state.year)} 學年度</div>
        <h1>${sch.meetTitle}秩序冊</h1>
        <div class="rule"></div>
        <div class="sub">FIELD DAY · PROGRAM</div>
        <div style="margin-top:60px; font-size:12px; color:#666; letter-spacing:.2em;">School Field Day · Grades 1-12</div>
      </div>`));

    // ===== Schedule =====
    const scheduled = state.events.filter(e => e.date || e.time).slice().sort((a, b) => {
      const da = (a.date || "9999") + " " + (a.time || "");
      const db = (b.date || "9999") + " " + (b.time || "");
      return da.localeCompare(db);
    });
    if (scheduled.length > 0) {
      const schedSection = h(`<div style="page-break-after: always;"></div>`);
      schedSection.appendChild(h(`<h2 class="section">賽程總覽</h2>`));
      // Group by date
      const byDate = new Map();
      scheduled.forEach(e => {
        const d = e.date || "未定日期";
        if (!byDate.has(d)) byDate.set(d, []);
        byDate.get(d).push(e);
      });
      Array.from(byDate.entries()).forEach(([d, evs]) => {
        schedSection.appendChild(h(`<h3 class="event-head">${d}</h3>`));
        schedSection.appendChild(h(`
          <table>
            <thead><tr><th style="width:60px;">時間</th><th style="width:70px;">場地</th><th>項目</th><th style="width:60px;">組別</th><th style="width:50px;">賽制</th></tr></thead>
            <tbody>
              ${evs.map(e => `
                <tr>
                  <td class="num" style="text-align:left;">${e.time || "—"}</td>
                  <td>${e.venue || "—"}</td>
                  <td>${e.name}</td>
                  <td>${e.gradeGroup}</td>
                  <td>${e.rounds === "prelim_final" ? "預+決" : "決"}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>`));
      });
      // Un-scheduled events at bottom of schedule page
      const unscheduled = state.events.filter(e => !e.date && !e.time);
      if (unscheduled.length > 0) {
        schedSection.appendChild(h(`<h3 class="event-head" style="color:#888; margin-top:20px;">未排時間的項目</h3>`));
        schedSection.appendChild(h(`<div style="font-size:12px; color:#555; line-height:1.8; padding-left:12px;">
          ${unscheduled.map(e => `<span style="margin-right:16px;">${e.name}（${e.gradeGroup}）</span>`).join("")}
        </div>`));
      }
      doc.appendChild(schedSection);
    }

    const groups = ["國小低", "國小中", "國小高", "國中", "高中"];
    groups.forEach(g => {
      const evs = state.events.filter(e => e.gradeGroup === g).sort((a, b) => {
        if (a.date && b.date && a.date !== b.date) return a.date.localeCompare(b.date);
        if (a.time && b.time && a.time !== b.time) return a.time.localeCompare(b.time);
        return a.name.localeCompare(b.name, "zh-Hant");
      });
      if (evs.length === 0) return;
      const section = h(`<div><h2 class="section">${g}組</h2></div>`);
      evs.forEach(ev => {
        let participants = "";
        if (ev.category === "relay") {
          const teams = state.teams.filter(t => t.eventId === ev.id && t.year === state.year);
          participants = teams.map(t => {
            const names = (t.members || []).slice(0, 4).map(id => state.students.find(s => s.id === id)?.name || "—").filter(Boolean).join("、");
            return `<span><b>${t.className}</b>：${names}</span>`;
          }).join("");
        } else {
          const regs = state.registrations.filter(r => r.eventId === ev.id && r.year === state.year);
          participants = regs.map(r => {
            const s = state.students.find(x => x.id === r.studentId);
            return `<span>${r.className} ${s ? s.name : "—"}</span>`;
          }).join("");
        }
        const schedLine = (ev.date || ev.time || ev.venue)
          ? `<span style="font-family:var(--mono); color:#666; font-size:11px; margin-left:8px;">${ev.date || ""} ${ev.time || ""}${ev.venue ? ` · ${ev.venue}` : ""}</span>`
          : "";
        const off = ev.officials && ev.officials.length
          ? `<div style="font-size:11px; color:#555; padding-left:12px; margin: 2px 0 4px;">裁判：${ev.officials.map(o => `${o.role} ${o.name}`).join("　")}</div>`
          : "";
        section.appendChild(h(`
          <h3 class="event-head">${ev.name}<span class="cat">${CAT_LABEL[ev.category]} · ${GENDER_LABEL[ev.gender]}${ev.rounds === "prelim_final" ? " · 預+決" : ""}</span>${schedLine}</h3>
          ${off}
          <div class="participants">${participants || "<span style='color:#999'>（尚無報名）</span>"}</div>
        `));
      });
      doc.appendChild(section);
    });
    wrap.appendChild(doc);
    return wrap;
  }
