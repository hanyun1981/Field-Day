  function printCertificates() {
    const wrap = document.createElement("div");
    const RANK_ZH = ["", "一", "二", "三"];
    const sch = getSchoolSettings();
    const today = new Date();
    const dateStr = `中華民國 ${today.getFullYear() - 1911} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日`;
    state.events.forEach(ev => {
      const ranked = scoringResultsForEvent(ev.id, state.year).filter(r => r.mark != null).slice(0, 3);
      ranked.forEach(r => {
        const s = state.students.find(x => x.id === r.studentId);
        const team = state.teams.find(t => t.id === r.teamId);
        let bodyHtml;
        if (team) {
          const memberNames = (team.members || []).slice(0, 4)
            .map(id => state.students.find(s => s.id === id)?.name).filter(Boolean).join("、");
          bodyHtml = `茲有 <span class="who">${r.className}</span> 代表隊（${memberNames}）
                參加 ${sch.schoolName} ${rocYear(state.year)} 學年度${sch.meetTitle}
                <span class="ev">${ev.name}</span> 競賽，
                榮獲第 ${RANK_ZH[r.rank] || r.rank} 名，
                成績 <b>${formatMark(r.mark, ev.unit)}</b>，特頒此狀，以資鼓勵。`;
        } else {
          bodyHtml = `茲有 <span class="who">${r.className}　${s ? s.name : "—"}</span> 同學，
                參加 ${sch.schoolName} ${rocYear(state.year)} 學年度${sch.meetTitle}
                <span class="ev">${ev.name}</span> 競賽，
                榮獲第 ${RANK_ZH[r.rank] || r.rank} 名，
                成績 <b>${formatMark(r.mark, ev.unit)}</b>，特頒此狀，以資鼓勵。`;
        }
        wrap.appendChild(h(`
          <div class="cert-page">
            <div class="cert-inner">
              <div class="school">${sch.schoolName} · ${sch.meetTitle} · ${state.year}</div>
              <div class="title">獎狀</div>
              <div class="rank-bar">第 ${RANK_ZH[r.rank] || r.rank} 名</div>
              <div class="body">${bodyHtml}</div>
              <div class="foot">
                <div class="date">${dateStr}</div>
                <div class="sig"><div class="line">${sch.principalName}</div></div>
              </div>
            </div>
          </div>`));
      });
    });
    if (wrap.children.length === 0) {
      wrap.appendChild(h(`<div class="cert-page" style="align-items:center; justify-content:center; display:flex;"><div style="text-align:center; color:#666; font-family:var(--serif);">本屆尚無可發之獎狀（無前三名成績）。</div></div>`));
    }
    return wrap;
  }

  // ---------- Helpers ----------
  function h(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

  function toast(msg) {
    const t = h(`<div class="toast">${msg}</div>`);
    $("#toasts").appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  function confirmModal(title, body, onConfirm) {
    modal({ title, body, okLabel: "確定", onOk: async () => { await onConfirm(); return true; } });
  }

  function modal({ title, body, okLabel = "確定", wide = false, onOk }) {
    const root = $("#modalRoot");
    const m = h(`
      <div class="modal-backdrop">
        <div class="modal ${wide ? "wide" : ""}">
          <header>${title}</header>
          <div class="body">${body || ""}</div>
          <footer>
            <button class="btn ghost" data-cancel>取消</button>
            <button class="btn primary" data-ok>${okLabel}</button>
          </footer>
        </div>
      </div>`);
    root.appendChild(m);
    m.querySelector("[data-cancel]").onclick = () => m.remove();
    m.querySelector("[data-ok]").onclick = async () => {
      const ok = onOk ? await onOk(m) : true;
      if (ok !== false) m.remove();
    };
    m.onclick = (e) => { if (e.target === m) m.remove(); };
  }

  // ---------- Kiosk (Live board) ----------
  let liveState = { eventId: null, prevBest: null };

  function routeFromHash() {
    const h1 = window.location.hash;
    const m = h1.match(/^#\/live\/(.+)$/);
    if (m) {
      liveState.eventId = m[1];
      document.body.classList.add("kiosk-live");
      document.body.classList.remove("kiosk-ceremony");
      renderLive();
      return true;
    }
    if (h1 === "#/ceremony") {
      document.body.classList.add("kiosk-ceremony");
      document.body.classList.remove("kiosk-live");
      startCeremonyPlayback();
      return true;
    }
    document.body.classList.remove("kiosk-live", "kiosk-ceremony");
    return false;
  }

  function renderLive() {
    const shell = document.getElementById("kioskShell");
    const eid = liveState.eventId;
    const ev = state.events.find(e => e.id === eid);
    if (!ev) {
      shell.innerHTML = `<div style="padding: 80px; text-align:center; color: var(--slate);">找不到此項目。<br><br><a href="#" onclick="window.location.hash=''; return false;">返回系統</a></div>`;
      return;
    }
    const ranked = scoringResultsForEvent(eid, state.year).filter(r => r.mark != null);
    const rec = eventRecord(eid);
    shell.innerHTML = "";
    shell.appendChild(h(`
      <div class="kiosk-header">
        <div>
          <div class="eyebrow">${ev.gradeGroup} · ${CAT_LABEL[ev.category]} · ${GENDER_LABEL[ev.gender]}${ev.rounds === "prelim_final" ? " · 決賽" : ""}</div>
          <h1>${ev.name}</h1>
        </div>
        <div class="meta">
          <div><span class="live-dot"></span>即時 · ${rocYear(state.year)} 學年度</div>
          <div style="margin-top:6px; font-size:11px; color:var(--slate);">大會紀錄　<b>${rec ? formatMark(rec.mark, ev.unit) : "—"}</b>${rec ? ` · ${rec.year}` : ""}</div>
          <div style="margin-top:10px;"><a href="#" onclick="window.location.hash=''; return false;" style="font-family:var(--label); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--slate); text-decoration:none;">← 返回</a></div>
        </div>
      </div>`));

    if (ranked.length === 0) {
      shell.appendChild(h(`
        <div style="padding: 60px; text-align:center; color: var(--slate); background: var(--panel); border-radius: 4px; border: 1px solid var(--rule);">
          <div style="font-family: var(--serif); font-size: 22px; margin-bottom: 8px;">尚未開始比賽</div>
          <div>當有成績登錄後，此頁會自動更新。</div>
        </div>`));
      return;
    }

    const table = h(`
      <table class="kiosk-live-table">
        <thead><tr>
          <th style="text-align:center;">名次</th>
          <th>選手</th>
          <th>班級</th>
          <th style="text-align:right;">成績</th>
          <th style="text-align:right;">積分</th>
          <th style="text-align:center;">紀錄</th>
        </tr></thead>
        <tbody></tbody>
      </table>`);
    const tbody = table.querySelector("tbody");
    ranked.slice(0, 12).forEach(r => {
      const s = state.students.find(x => x.id === r.studentId);
      const team = state.teams.find(t => t.id === r.teamId);
      const nm = s ? s.name : (team ? `${team.className} 接力隊` : "—");
      const isRec = rec && r.mark === rec.mark && r.year === rec.year;
      const cls = r.rank === 1 ? "top1" : r.rank === 2 ? "top2" : r.rank === 3 ? "top3" : "";
      tbody.appendChild(h(`
        <tr class="${isRec ? 'new-record' : ''}">
          <td class="rank ${cls}">${r.rank}</td>
          <td class="name">${nm}</td>
          <td class="class">${r.className}</td>
          <td class="mark">${formatMark(r.mark, ev.unit)}</td>
          <td class="points">${r.points || "—"}</td>
          <td class="rec">${isRec ? `<span class="record-flag">大會新猷</span>` : ""}</td>
        </tr>`));
    });
    shell.appendChild(table);
  }

  // ---------- Ceremony playback ----------
  let ceremonyTimer = null;
  let ceremonyIdx = 0;
  let ceremonyPlaylist = [];
  let ceremonyPaused = false;

  function buildCeremonyPlaylist() {
    // Slides: 1) Overall standings, 2) For each event: top 3, 3) For each record: dramatic reveal
    const items = [];
    // Overall
    const stand = championshipStandings(state.year);
    if (stand.length > 0) items.push({ kind: "standings", data: stand });
    // Events with results: top 3
    state.events.forEach(ev => {
      const ranked = scoringResultsForEvent(ev.id, state.year).filter(r => r.mark != null);
      if (ranked.length === 0) return;
      const rec = eventRecord(ev.id);
      const isRecordYear = rec && rec.year === state.year;
      if (isRecordYear) {
        items.push({ kind: "record", ev, rec, top: ranked.slice(0, 3) });
      }
      items.push({ kind: "podium", ev, top: ranked.slice(0, 3) });
    });
    return items;
  }

  function startCeremony(fullscreen) {
    window.location.hash = "#/ceremony";
    if (fullscreen) {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    }
  }

  function startCeremonyPlayback() {
    ceremonyIdx = 0;
    ceremonyPaused = false;
    ceremonyPlaylist = buildCeremonyPlaylist();
    if (ceremonyPlaylist.length === 0) {
      document.getElementById("ceremonyShell").innerHTML = `
        <div style="margin:auto; text-align:center; color:#B08133; font-family:var(--serif);">
          <div style="font-size:28px; margin-bottom:12px;">尚無可播放的成績</div>
          <div style="font-size:14px; color:#F1EAD8;">請先登錄本屆比賽成績。</div>
          <div style="margin-top:24px;"><a href="#" onclick="window.location.hash=''; return false;" style="color:#B08133;">← 返回</a></div>
        </div>`;
      return;
    }
    paintCeremony();
    startCeremonyTimer();
  }
  function startCeremonyTimer() {
    stopCeremonyTimer();
    if (ceremonyPaused) return;
    const cur = ceremonyPlaylist[ceremonyIdx];
    const dur = cur && cur.kind === "record" ? 6500 : 8000;
    ceremonyTimer = setTimeout(() => {
      ceremonyIdx = (ceremonyIdx + 1) % ceremonyPlaylist.length;
      paintCeremony();
      startCeremonyTimer();
    }, dur);
  }
  function stopCeremonyTimer() {
    if (ceremonyTimer) { clearTimeout(ceremonyTimer); ceremonyTimer = null; }
  }

  function paintCeremony() {
    const shell = document.getElementById("ceremonyShell");
    if (ceremonyPlaylist.length === 0) return;
    const item = ceremonyPlaylist[ceremonyIdx];
    shell.innerHTML = "";
    const sch = getSchoolSettings();

    if (item.kind === "record") {
      const ev = item.ev, rec = item.rec;
      // Find prior record (best from other years)
      const prior = state.results.filter(r => r.eventId === ev.id && r.year !== state.year && r.mark != null);
      const priorBest = prior.length ? prior.reduce((a, b) => ev.unit === "seconds" ? (a.mark <= b.mark ? a : b) : (a.mark >= b.mark ? a : b)).mark : null;
      const diff = priorBest != null ? Math.abs(rec.mark - priorBest).toFixed(2) : null;
      const diffTxt = diff ? (ev.unit === "seconds" ? `快 ${diff} 秒` : `多 ${diff} 公尺`) : "首屆紀錄";
      shell.appendChild(h(`
        <div class="ceremony-record">
          <div class="flash-ribbon">★ 大會新猷 ★</div>
          <div class="big-title">破紀錄</div>
          <div class="event-name">${ev.gradeGroup} · ${ev.name}</div>
          <div class="who"><span class="cls">${rec.className}</span>${rec.student}</div>
          <div class="mark-line">
            ${priorBest != null ? `<span class="old">${formatMark(priorBest, ev.unit)}</span><span class="arrow">→</span>` : ""}
            <span class="new">${formatMark(rec.mark, ev.unit)}</span>
          </div>
          <div class="diff">${diffTxt}</div>
        </div>
      `));
    } else if (item.kind === "standings") {
      shell.appendChild(h(`<div class="ceremony-eyebrow">${sch.schoolName} · ${rocYear(state.year)} 學年度</div>`));
      shell.appendChild(h(`<h1 class="ceremony-title">總錦標</h1>`));
      shell.appendChild(h(`<div class="ceremony-sub">Overall Championship</div>`));
      const list = h(`<div style="max-width:800px; margin:0 auto; width:100%;"></div>`);
      item.data.slice(0, 8).forEach((s, i) => {
        list.appendChild(h(`
          <div style="display:grid; grid-template-columns: 60px 1fr 120px 100px; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,.1); align-items:center; animation: rise 400ms ease-out ${i * 60}ms both;">
            <div style="font-family:var(--mono); font-size:32px; font-weight:600; color:${i === 0 ? '#E8B858' : i === 1 ? '#C9C0AF' : i === 2 ? '#D8815C' : '#7A7F8A'};">${i + 1}</div>
            <div style="font-family:var(--serif); font-size:28px; font-weight:500; color:#F5EFD8;">${s.className}</div>
            <div style="font-family:var(--label); font-size:12px; letter-spacing:.14em; color:#9CA2AE;">${s.gradeGroup}</div>
            <div style="font-family:var(--mono); font-size:32px; font-weight:600; color:#EDCA75; text-align:right;">${s.points}</div>
          </div>`));
      });
      shell.appendChild(list);
    } else {
      // Podium
      const ev = item.ev;
      shell.appendChild(h(`<div class="ceremony-eyebrow">${ev.gradeGroup} · ${CAT_LABEL[ev.category]}</div>`));
      shell.appendChild(h(`<h1 class="ceremony-title">${ev.name}</h1>`));
      shell.appendChild(h(`<div class="ceremony-sub">${GENDER_LABEL[ev.gender]}子組 · Final</div>`));
      const podium = h(`<div class="ceremony-podium"></div>`);
      const order = [1, 0, 2]; // display: silver | gold | bronze
      order.forEach(idx => {
        const r = item.top[idx];
        if (!r) {
          podium.appendChild(h(`<div></div>`));
          return;
        }
        const s = state.students.find(x => x.id === r.studentId);
        const team = state.teams.find(t => t.id === r.teamId);
        const nm = s ? s.name : (team ? `${team.className} 接力隊` : "—");
        const rankNum = idx + 1;
        podium.appendChild(h(`
          <div class="podium-slot p${rankNum}">
            <div class="podium-rank">第 ${["一", "二", "三"][idx]} 名</div>
            <div class="podium-name">${nm}</div>
            <div class="podium-class">${r.className}</div>
            <div class="podium-mark">${formatMark(r.mark, ev.unit)}</div>
          </div>`));
      });
      shell.appendChild(podium);
    }

    // Progress ticks + controls
    const prog = h(`<div class="ceremony-progress"></div>`);
    ceremonyPlaylist.forEach((_, i) => {
      prog.appendChild(h(`<div class="tick ${i === ceremonyIdx ? "on" : ""}"></div>`));
    });
    shell.appendChild(prog);
    const ctrls = h(`
      <div class="ceremony-controls">
        <button data-act="prev">← 上一頁</button>
        <button data-act="toggle">${ceremonyPaused ? "▶ 繼續" : "⏸ 暫停"}</button>
        <button data-act="next">下一頁 →</button>
        <button data-act="exit">✕ 離開</button>
      </div>`);
    ctrls.querySelectorAll("[data-act]").forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        const a = b.dataset.act;
        if (a === "prev") { ceremonyIdx = (ceremonyIdx - 1 + ceremonyPlaylist.length) % ceremonyPlaylist.length; paintCeremony(); startCeremonyTimer(); }
        if (a === "next") { ceremonyIdx = (ceremonyIdx + 1) % ceremonyPlaylist.length; paintCeremony(); startCeremonyTimer(); }
        if (a === "toggle") { ceremonyPaused = !ceremonyPaused; if (ceremonyPaused) stopCeremonyTimer(); else startCeremonyTimer(); paintCeremony(); }
        if (a === "exit") { exitCeremony(); }
      };
    });
    shell.appendChild(ctrls);
  }

  function exitCeremony() {
    stopCeremonyTimer();
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    window.location.hash = "";
    routeFromHash();
  }

  // Keyboard controls for kiosk modes
  document.addEventListener("keydown", (e) => {
    if (document.body.classList.contains("kiosk-ceremony")) {
      if (e.key === "Escape") exitCeremony();
      if (e.key === "ArrowRight") { ceremonyIdx = (ceremonyIdx + 1) % ceremonyPlaylist.length; paintCeremony(); startCeremonyTimer(); }
      if (e.key === "ArrowLeft") { ceremonyIdx = (ceremonyIdx - 1 + ceremonyPlaylist.length) % ceremonyPlaylist.length; paintCeremony(); startCeremonyTimer(); }
      if (e.key === " ") { e.preventDefault(); ceremonyPaused = !ceremonyPaused; if (ceremonyPaused) stopCeremonyTimer(); else startCeremonyTimer(); paintCeremony(); }
    }
    if (document.body.classList.contains("kiosk-live") && e.key === "Escape") {
      window.location.hash = "";
      routeFromHash();
    }
  });

  // Watch hash changes (from user or from internal navigation)
  window.addEventListener("hashchange", () => {
    const inKiosk = routeFromHash();
    if (!inKiosk) render();
  });

  // ---------- Wire up ----------
  $("#newYearBtn").onclick = () => {
    if (!can("manageYear")) return toast("需管理員權限");
    const nextRoc = rocYear(state.years[0] || new Date().getFullYear()) + 1;
    const y = prompt("新增學年度（民國年，例如 116）", String(nextRoc));
    if (!y) return;
    const ce = ceFromInput(y);
    if (!ce) return toast("請輸入年份");
    addYear(ce);
    state.year = ce;
    render();
    toast(`已新增 ${rocYear(ce)} 學年度`);
  };

  loadSession();
  initDb();
  // Once we're ready, route from hash if applicable
  const readyWatcher = setInterval(() => {
    if (state.ready) {
      clearInterval(readyWatcher);
      routeFromHash();
    }
  }, 100);
})();
</script>
